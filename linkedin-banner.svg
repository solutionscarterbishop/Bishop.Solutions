<svg width="1584" height="396" viewBox="0 0 1584 396" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1584" height="396" fill="url(#bgGradient)"/>

  <!-- Subtle grid pattern overlay -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.5"/>
  </pattern>
  <rect width="1584" height="396" fill="url(#grid)" opacity="0.3"/>

  <!-- "Bishop Solutions" text - centered right -->
  <text x="650" y="185" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="64" font-weight="700" fill="#ffffff">Bishop Solutions</text>

  <!-- Tagline -->
  <text x="650" y="240" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="24" font-weight="400" fill="#94a3b8">Review Intelligence for Multi-Location Businesses</text>

  <!-- Subtle accent line -->
  <rect x="650" y="260" width="120" height="3" rx="1.5" fill="url(#logoGradient)" opacity="0.8"/>

  <!-- Bishop logo (chess piece) - positioned RIGHT side -->
  <g transform="translate(1250, 98) scale(2)">
    <!-- Base -->
    <ellipse cx="50" cy="90" rx="30" ry="6" fill="url(#logoGradient)"/>
    <!-- Stem base -->
    <rect x="35" y="75" width="30" height="15" rx="2" fill="url(#logoGradient)"/>
    <!-- Main body -->
    <path d="M35 75 Q30 55 38 35 Q42 25 50 20 Q58 25 62 35 Q70 55 65 75 Z" fill="url(#logoGradient)"/>
    <!-- Collar/ring -->
    <ellipse cx="50" cy="35" rx="12" ry="4" fill="url(#logoGradient)" opacity="0.8"/>
    <!-- Head -->
    <ellipse cx="50" cy="22" rx="10" ry="12" fill="url(#logoGradient)"/>
    <!-- Top point -->
    <circle cx="50" cy="8" r="5" fill="url(#logoGradient)"/>
    <!-- Diagonal slit -->
    <path d="M44 18 L52 28" stroke="#0f172a" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>
